# Simple Docker Compose for DataLens Development
# Uses lightweight placeholder containers integrated with Moose stack

version: "3.8"

services:
  # Placeholder DataLens backend - integrated with Moose
  datalens-backend:
    image: python:3.12-slim
    ports:
      - "8083:8080" # Changed from 8082 to avoid Redpanda conflict
    environment:
      # Use external ClickHouse (same as Moose)
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_HOST_PORT}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB_NAME}
      - CLICKHOUSE_USE_SSL=${CLICKHOUSE_USE_SSL}
      # Kafka/Redpanda configuration for DataLens events (different topics)
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC_PREFIX=datalens_
      - KAFKA_CONSUMER_GROUP=datalens-consumers
    volumes:
      - ./config:/app/config:ro
    networks:
      - datalens-network
      - data-warehouse_default # Connect to Moose Redis and Redpanda network
    external_links:
      - data-warehouse_redis_1:redis
      - data-warehouse_redpanda_1:redpanda
    command: >
      sh -c "
        echo 'DataLens Backend Placeholder - Port 8083 (integrated with Moose)';
        echo 'External ClickHouse: ${CLICKHOUSE_HOST}:${CLICKHOUSE_HOST_PORT}';
        echo 'Database: ${CLICKHOUSE_DB_NAME}';
        echo 'Redis: redis:6379/1 (Moose shared, different channel)';
        echo 'Redpanda: redpanda:9092 (Moose shared, datalens_ topics)';
        echo 'Waiting for actual DataLens backend implementation...';
        python -m http.server 8080
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Placeholder DataLens frontend
  datalens-frontend:
    image: nginx:alpine
    ports:
      - "8081:8080"
    volumes:
      - ./placeholder:/usr/share/nginx/html:ro
    networks:
      - datalens-network
    depends_on:
      - datalens-backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  datalens-network:
    driver: bridge
  # External networks to connect to Moose services
  data-warehouse_default:
    external: true
