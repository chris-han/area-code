# Simple Docker Compose for DataLens Development
# Uses lightweight containers for initial setup

version: '3.8'

services:
  # Nginx reverse proxy for port conflict resolution
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "9080:9080"  # Unified access point
      - "8081:8081"  # Direct DataLens access
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - datalens-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Placeholder DataLens backend (will be replaced when repositories are available)
  datalens-backend-placeholder:
    image: python:3.11-slim
    ports:
      - "8082:8080"
    environment:
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_HOST_PORT}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB_NAME}
      - CLICKHOUSE_USE_SSL=${CLICKHOUSE_USE_SSL}
    volumes:
      - ./config:/app/config:ro
    networks:
      - datalens-network
    command: >
      sh -c "
        echo 'DataLens Backend Placeholder - Port 8082';
        echo 'ClickHouse: ${CLICKHOUSE_HOST}:${CLICKHOUSE_HOST_PORT}';
        echo 'Database: ${CLICKHOUSE_DB_NAME}';
        echo 'Waiting for actual DataLens backend implementation...';
        python -m http.server 8080
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Placeholder DataLens frontend
  datalens-frontend-placeholder:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./frontend/placeholder:/usr/share/nginx/html:ro
    networks:
      - datalens-network
    depends_on:
      - datalens-backend-placeholder
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  datalens-network:
    driver: bridge