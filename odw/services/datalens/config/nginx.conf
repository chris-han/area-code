# Nginx Reverse Proxy Configuration for DataLens
# Provides unified access to DataLens services

events {
    worker_connections 1024;
}

http {
    upstream datalens_frontend {
        server datalens-frontend:8080;
    }
    
    upstream datalens_backend {
        server datalens-backend:8080;
    }

    # Main server block - unified access point
    server {
        listen 9080;
        server_name localhost;

        # DataLens Frontend (default path)
        location / {
            proxy_pass http://datalens_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket support for DataLens
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # DataLens Backend API
        location /api/ {
            proxy_pass http://datalens_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Direct access to DataLens (port 8081)
    server {
        listen 8081;
        server_name localhost;
        
        location / {
            proxy_pass http://datalens_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}