# Docker Compose Override for Development
# Adds nginx proxy and development-specific configurations

version: '3.8'

services:
  # Nginx reverse proxy for unified access
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "9081:9080"  # Changed from 9080 to avoid potential conflicts
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - datalens-frontend
      - datalens-backend
    networks:
      - datalens-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  datalens-backend:
    environment:
      # Development-specific environment variables
      - DEBUG=true
      - LOG_LEVEL=info
      - ENABLE_CORS=true
      # Use Moose Redis with different database (1 instead of 0)
      - DL_REDIS_URL=redis://redis:6379/1
      # Kafka/Redpanda configuration for DataLens events (different topics)
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC_PREFIX=datalens_
      - KAFKA_CONSUMER_GROUP=datalens-consumers
      - KAFKA_DEBUG=true
    volumes:
      # Additional development mounts
      - ./datalens-ui/abi-extensions:/app/abi-extensions:ro

  datalens-frontend:
    environment:
      # Development-specific frontend settings
      - NODE_ENV=development
      - REACT_APP_API_URL=http://localhost:8083  # Updated to match new backend port
      - REACT_APP_ENABLE_ABI_EXTENSIONS=true
    volumes:
      # Hot reload support for development
      - ./datalens-ui/abi-extensions/src:/app/src/abi-extensions:ro