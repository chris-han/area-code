version: '3.8'

services:
  datalens-backend:
    build:
      context: ./backend/datalens-backend
      dockerfile: ../../backend-abi.Dockerfile
    ports:
      - "8082:8080"
    environment:
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_HOST_PORT}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB_NAME}
      - CLICKHOUSE_USE_SSL=${CLICKHOUSE_USE_SSL}
      - CORS_ORIGINS=http://localhost:8081,http://localhost:3000
      - DL_CRY_ACTUAL_KEY=stub-key-for-dev
      - DL_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./config:/app/config
    networks:
      - datalens-network
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  datalens-frontend:
    build:
      context: ./frontend/datalens-ui
      dockerfile: ../../frontend-abi.Dockerfile
      args:
        - BACKEND_URL=http://localhost:8082
    ports:
      - "8081:8080"
    environment:
      - BACKEND_URL=http://localhost:8082
      - ENABLE_ABI_EXTENSIONS=true
      - FOCUS_SPECIFICATION_VERSION=1.0
    depends_on:
      - datalens-backend
    networks:
      - datalens-network
    volumes:
      - ./frontend/abi-extensions:/app/abi-extensions

  redis:
    image: redis:7-alpine
    networks:
      - datalens-network
    ports:
      - "6379:6379"

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "9080:9080"  # Unified access point
      - "8081:8081"  # Direct DataLens access
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - datalens-network
    depends_on:
      - datalens-frontend
      - datalens-backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  datalens-network:
    driver: bridge