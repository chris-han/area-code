# DataLens Docker Compose - Integrated with Moose Data Warehouse
# 
# Network Architecture Diagram:
# ┌─────────────────────────────────────────────────────────────────────────────────────┐
# │                           EXTERNAL SERVICES                                         │
# │  ┌─────────────────────┐                                                            │
# │  │   ClickHouse DB     │ ← Shared external database                                 │
# │  │ ${CLICKHOUSE_HOST}  │   (Both DataLens & Moose connect here)                    │
# │  │ :${CLICKHOUSE_PORT} │                                                            │
# │  └─────────────────────┘                                                            │
# └─────────────────────────────────────────────────────────────────────────────────────┘
#                                    ↑
#                                    │ External connection
#                                    │
# ┌─────────────────────────────────────────────────────────────────────────────────────┐
# │                        MOOSE DATA WAREHOUSE STACK                                   │
# │  ┌─────────────────────┐  ┌─────────────────────┐  ┌─────────────────────┐        │
# │  │       Redis         │  │      Redpanda       │  │      Temporal       │        │
# │  │    (Moose Stack)    │  │   (Kafka-compat)    │  │    Workflow Eng     │        │
# │  │                     │  │                     │  │                     │        │
# │  │ Port: 6379          │  │ Kafka: 9092         │  │ Port: 7233          │        │
# │  │ DB 0: Moose data    │  │ Proxy: 18082        │  │ UI: 8080            │        │
# │  │ DB 1: DataLens ←────┼──┤ Topics:             │  │                     │        │
# │  │       cache         │  │ - default (Moose)   │  │                     │        │
# │  └─────────────────────┘  │ - datalens_* ←──────┼──┤                     │        │
# │                           │   (DataLens)        │  │                     │        │
# │                           └─────────────────────┘  └─────────────────────┘        │
# │                                    ↑                        ↑                     │
# │  Network: data-warehouse_default   │                        │                     │
# └────────────────────────────────────┼────────────────────────┼─────────────────────┘
#                                      │                        │
#                                      │ External links         │
#                                      │                        │
# ┌─────────────────────────────────────┼────────────────────────┼─────────────────────┐
# │                    DATALENS STACK   │                        │                     │
# │                                     │                        │                     │
# │  ┌─────────────────────┐            │                        │                     │
# │  │   Nginx Proxy       │            │                        │                     │
# │  │                     │            │                        │                     │
# │  │ Host: 9081 → 9080   │            │                        │                     │
# │  │                     │            │                        │                     │
# │  │ Routes:             │            │                        │                     │
# │  │ / → Frontend        │            │                        │                     │
# │  │ /api/ → Backend     │            │                        │                     │
# │  │ /health → Status    │            │                        │                     │
# │  └─────────────────────┘            │                        │                     │
# │           │                         │                        │                     │
# │           │ datalens-network        │                        │                     │
# │           │                         │                        │                     │
# │  ┌─────────────────────┐  ┌─────────────────────┐            │                     │
# │  │  DataLens Frontend  │  │  DataLens Backend   │            │                     │
# │  │                     │  │                     │            │                     │
# │  │ Host: 8081 → 8080   │  │ Host: 8083 → 8080   │            │                     │
# │  │                     │  │                     │            │                     │
# │  │ - React UI          │  │ - Python/Node API   │            │                     │
# │  │ - ABI Extensions    │  │ - Query Engine      │            │                     │
# │  │                     │  │ - Chart Generation  │            │                     │
# │  └─────────────────────┘  └─────────────────────┘            │                     │
# │                                     │                        │                     │
# │                                     │ Connects to:           │                     │
# │                                     │ - Redis DB 1 ──────────┘                     │
# │                                     │ - Redpanda (datalens_topics) ────────────────┘
# │                                     │ - External ClickHouse ────────────────────────┘
# │                                     │                                               │
# │  Network: datalens-network          │                                               │
# │  External: data-warehouse_default ──┘                                               │
# └─────────────────────────────────────────────────────────────────────────────────────┘
#
# Port Summary:
# ┌─────────────────┬──────────────┬─────────────────────────────────────────────────────┐
# │ Service         │ Host Port    │ Description                                         │
# ├─────────────────┼──────────────┼─────────────────────────────────────────────────────┤
# │ DataLens UI     │ 8081         │ Main DataLens web interface                         │
# │ DataLens API    │ 8083         │ DataLens backend API (changed from 8082)           │
# │ DataLens Proxy  │ 9081         │ Unified access point (changed from 9080)           │
# │ Temporal UI     │ 8080         │ Moose workflow management UI                        │
# │ Redpanda Proxy  │ 18082        │ Moose Kafka REST API                               │
# │ Redis           │ 6379         │ Moose shared cache (DB 0=Moose, DB 1=DataLens)     │
# │ ClickHouse      │ External     │ Shared external database                            │
# └─────────────────┴──────────────┴─────────────────────────────────────────────────────┘
#
# Data Flow:
# 1. User → DataLens UI (8081) → DataLens API (8083)
# 2. DataLens API → External ClickHouse (queries)
# 3. DataLens API → Redis DB 1 (caching)
# 4. DataLens API → Redpanda datalens_* topics (events)
# 5. Moose → Redis DB 0, Redpanda default topics, External ClickHouse
#
version: "3.8"

services:
  datalens-backend:
    build:
      context: ../..
      dockerfile: services/datalens/backend-abi.Dockerfile
      # Alternative: Use official Dockerfile
      # context: ./datalens-backend
      # dockerfile: docker_build/debian_docker/Dockerfile
    ports:
      - "8083:8080" # Changed from 8082 to avoid Redpanda conflict
    environment:
      # Use external ClickHouse (same as Moose)
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST}
      - CLICKHOUSE_PORT=${CLICKHOUSE_HOST_PORT}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DB=${CLICKHOUSE_DB_NAME}
      - CLICKHOUSE_USE_SSL=${CLICKHOUSE_USE_SSL}
      - CORS_ORIGINS=http://localhost:8081,http://localhost:3000
      - DL_CRY_ACTUAL_KEY=stub-key-for-dev
      # Use Moose Redis with different database (1 instead of 0)
      - DL_REDIS_URL=redis://redis:6379/1
      # Kafka/Redpanda configuration for DataLens events (different topics)
      - KAFKA_BROKERS=redpanda:9092
      - KAFKA_TOPIC_PREFIX=datalens_
      - KAFKA_CONSUMER_GROUP=datalens-consumers
    volumes:
      - ./config:/app/config:ro
    networks:
      - datalens-network
      - data-warehouse_default # Connect to Moose Redis and Redpanda network
    external_links:
      - data-warehouse_redis_1:redis
      - data-warehouse_redpanda_1:redpanda
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  datalens-frontend:
    build:
      context: ../..
      dockerfile: services/datalens/frontend-abi.Dockerfile
      args:
        - BACKEND_URL=http://localhost:8083 # Updated to match new backend port
    ports:
      - "8081:8080"
    environment:
      - BACKEND_URL=http://localhost:8083 # Updated to match new backend port
      - ENABLE_ABI_EXTENSIONS=true
      - FOCUS_SPECIFICATION_VERSION=1.0
    depends_on:
      - datalens-backend
    networks:
      - datalens-network
    volumes:
      - ./datalens-ui/abi-extensions:/app/abi-extensions:ro

  nginx-proxy:
    image: nginx:alpine
    ports:
      - "9081:9080" # Changed from 9080 to avoid potential conflicts
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - datalens-network
    depends_on:
      - datalens-frontend
      - datalens-backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9080/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  datalens-network:
    driver: bridge
  # External networks to connect to Moose services
  data-warehouse_default:
    external: true
