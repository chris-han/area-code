[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    asyncio: Async test marker
    integration: Integration tests
    focus: FOCUS compliance tests
    performance: Performance and load tests
    monitoring: System monitoring tests
    slow: Slow running tests
    comprehensive: Comprehensive test coverage
    focus_billing: FOCUS billing specific tests
asyncio_mode = auto
addopts = 
    --strict-markers
    --strict-config
    --disable-warnings
    -ra
    --asyncio-mode=auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning