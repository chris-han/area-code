[pytest]
# Pytest configuration for FOCUS billing tests

# Test discovery patterns
python_files = test_moose_*.py test_schema_*.py
python_classes = Test*
python_functions = test_*

# Test paths (only run new Moose tests)
testpaths =
    app/focus_billing/tests

# Markers for test categorization
markers =
    integration: Integration tests requiring external services (Moose, ClickHouse)
    slow: Slow-running tests (>5 seconds)
    e2e: End-to-end tests covering full workflow
    unit: Fast unit tests (default)

# Output configuration
console_output_style = progress
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes

# Async support
asyncio_mode = auto

# Ignore warnings from dependencies
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
