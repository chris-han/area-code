[project]
name = "data-warehouse"
version = "0.1.0"
description = "Azure Billing Intelligence Platform with FOCUS compliance"
requires-python = ">=3.12"
dependencies = [
    "kafka-python-ng>=2.2.2",
    "clickhouse-connect",
    "requests>=2.32.4",
    "moose-cli",
    "moose-lib",
    "Pillow>=10.0.0",
    "boto3>=1.26.0",
    "toml>=0.10.0",
    "faker",
    "anthropic>=0.57.1",
    "python-dotenv>=1.0.0",
    # bia-specific dependencies
    "fastapi>=0.104.0",
    "pydantic>=2.5.0",
    "temporalio>=1.5.0",
    "clickhouse-driver>=0.2.6",
    "redis>=5.0.0",
    "uvicorn>=0.24.0",
    "azure-identity>=1.12.0",
    "minio>=7.1.0",
    "psycopg2-binary>=2.9.0",
    "aiohttp>=3.8.0",
    "pytest>=8.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "testcontainers>=3.7.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py312"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
