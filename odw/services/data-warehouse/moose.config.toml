[supported_old_versions]

[authentication]

[s3_config]
# S3/MinIO configuration for unstructured data storage
endpoint_url = "http://localhost:9500"  # MinIO endpoint, set to empty string for AWS S3
access_key_id = "minioadmin"
secret_access_key = "minioadmin"
region_name = "us-east-1"
bucket_name = "unstructured-data"
signature_version = "s3v4"

[features]
streaming_engine = true
workflows = true
data_model_v2 = true

[plugin_system]
plugin_directory = "./plugins"
marketplace_url = "https://bia-plugins.registry.com"
auto_update = false
lazy_loading = true
cache_plugins = true

[plugin_registry_db]
host = "localhost"
port = 5432
database = "bia_config"
user = "temporal"
password = "temporal"
schema = "plugin_registry"

[datalens_config]
base_url = "http://localhost:8081"
api_endpoint = "/api/v1"
auth_type = "none"
default_connection = "clickhouse_focus"
enable_abi_extensions = true
port = 8081

[focus_config]
specification_version = "1.0"
validation_strict = true
required_dimensions = ["billing_account_id", "usage_date", "billed_cost"]
currency_default = "USD"
